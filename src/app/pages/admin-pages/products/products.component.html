<div class="container mt-4">

  <h2>Manage Products</h2>

  <table class="table table-bordered">

    <thead>
      <tr>
        <th>ID</th>
        <th>Image</th>
        <th>Title</th>
        <th>Price</th>
      </tr>
    </thead>

    <tbody>

      <tr *ngFor="let product of products">

        <td>{{product.id}}</td>

        <td>
          <img
            [src]="product.thumbnail"
            width="70">
        </td>

        <td>{{product.title}}</td>

        <td>₹ {{product.price}}</td>

      </tr>

    </tbody>

  </table>

</div>
