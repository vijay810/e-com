<div class="container mt-4">

  <div class="row">

    <div
      class="col-md-3 mb-4"
      *ngFor="let product of products">

      <div class="card h-100 shadow">

        <img
          [src]="product.thumbnail"
          class="card-img-top">

        <div class="card-body">

          <h5>{{product.title}}</h5>

          <p>
            ₹ {{product.price}}
          </p>

          <button
            class="btn btn-primary w-100"
            (click)="details(product.id)">

            View Details

          </button>

        </div>

      </div>

    </div>

  </div>

</div>
