<div
 class="container mt-5"
 *ngIf="product">

  <div class="row">

    <div class="col-md-6">

      <img
       [src]="product.thumbnail"
       class="img-fluid">

    </div>

    <div class="col-md-6">

      <h2>{{product.title}}</h2>

      <h3>
        ₹ {{product.price}}
      </h3>

      <p>
        {{product.description}}
      </p>

      <button
        class="btn btn-success"
        (click)="addToCart()">

        Add To Cart

      </button>

    </div>

  </div>

</div>
